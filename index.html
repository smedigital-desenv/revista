<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio MAG</title>
  <meta name="description" content="Revista digital da Secretaria Municipal de Educação">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <style>
    /* Tela de login com identidade do sistema (layout dividido).
       Textos/cor/imagem vêm do painel central (sistema_landing, slug 'revista'). */
    #app-login.rv-login{ padding:0; align-items:center; justify-content:center;
      background:
        radial-gradient(900px 500px at 12% 6%, rgba(255,255,255,.08), transparent 60%),
        linear-gradient(135deg, var(--rev-cor,#be123c), #140309 80%); }
    .rv-wrap{ display:flex; gap:44px; max-width:1040px; width:100%; padding:40px 24px; align-items:center; }
    .rv-left{ flex:1.1; color:#fff; min-width:0; }
    .rv-brand{ display:flex; align-items:center; gap:12px; margin-bottom:24px; }
    .rv-avatar{ width:44px; height:44px; border-radius:12px; background:rgba(255,255,255,.16);
      display:grid; place-items:center; font-weight:900; font-size:1rem; overflow:hidden; color:#fff; }
    .rv-avatar img{ width:100%; height:100%; object-fit:cover; }
    .rv-marca{ font-weight:800; letter-spacing:.02em; font-size:.8rem; text-transform:uppercase; color:#fff; }
    .rv-sub{ font-size:.8rem; color:rgba(255,255,255,.72); }
    .rv-titulo{ font-weight:900; font-size:2.4rem; line-height:1.08; margin:0 0 14px; letter-spacing:-.01em; color:#fff; }
    .rv-tagline{ font-size:1rem; color:rgba(255,255,255,.82); line-height:1.5; margin:0 0 24px; max-width:520px; }
    .rv-features{ list-style:none; padding:0; margin:0 0 22px; display:flex; flex-direction:column; gap:14px; }
    .rv-features li{ display:flex; gap:13px; align-items:flex-start; }
    .rv-features .fi{ flex:none; width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.12);
      display:grid; place-items:center; color:#fff; font-size:1.02rem; }
    .rv-features b{ display:block; font-weight:700; font-size:.94rem; color:#fff; }
    .rv-features span{ color:rgba(255,255,255,.72); font-size:.86rem; line-height:1.4; }
    .rv-foot{ font-weight:700; font-size:.88rem; color:#ffd7e0; }
    .rv-card{ width:380px; background:var(--card); border:1px solid var(--border);
      border-radius:20px; padding:32px 30px; text-align:center; }
    .rv-card .login-logo{ font-size:30px; }
    .rv-card-t{ font-weight:900; font-size:1.35rem; margin:14px 0 4px; color:#fff; }
    .rv-card-s{ color:var(--muted); font-size:.9rem; margin:0 0 18px; }
    @media (max-width:840px){
      .rv-wrap{ flex-direction:column; gap:24px; padding:30px 18px; }
      .rv-left{ width:100%; } .rv-titulo{ font-size:1.9rem; } .rv-card{ width:100%; }
    }
  </style>
</head>
<body>

  <!-- Loading splash -->
  <div id="app-loading" class="app-screen">
    <div class="splash">
      <div class="splash-logo">PORTFOLIO MAG</div>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Login (identidade do sistema — textos vêm do painel central) -->
  <div id="app-login" class="app-screen rv-login" style="display:none">
    <div class="rv-wrap">
      <section class="rv-left">
        <div class="rv-brand">
          <div class="rv-avatar" id="rv-avatar"></div>
          <div><div class="rv-marca" id="rv-marca"></div><div class="rv-sub" id="rv-sub"></div></div>
        </div>
        <h1 class="rv-titulo" id="rv-titulo"></h1>
        <p class="rv-tagline" id="rv-tagline"></p>
        <ul class="rv-features" id="rv-features"></ul>
        <div class="rv-foot"><i class="bi bi-check2-circle"></i> Acesso institucional pela rede SME.</div>
      </section>
      <aside class="rv-card">
        <div class="login-logo">PORTFOLIO MAG</div>
        <h2 class="rv-card-t" id="rv-cta">Entrar</h2>
        <p class="rv-card-s">Use sua conta institucional para entrar.</p>
        <button id="btn-google-login" class="btn btn-primary btn-google">
          <span class="g-ic">G</span> Entrar com Google
        </button>
        <p class="login-hint">Use o e-mail cadastrado pela Secretaria.</p>
      </aside>
    </div>
  </div>

  <!-- Sem acesso -->
  <div id="app-no-access" class="app-screen" style="display:none">
    <div class="login-card">
      <div class="na-ic">🔒</div>
      <h2 class="na-title">Sem acesso</h2>
      <p id="no-access-msg" class="login-sub">Seu e-mail não está cadastrado no sistema.</p>
      <button id="btn-no-access-logout" class="btn btn-ghost">Sair</button>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" style="display:none">
    <header id="topbar">
      <div id="tb-back" class="tb-back">‹ Voltar</div>
      <nav id="tb-breadcrumb" class="tb-breadcrumb"></nav>
      <div id="tb-right" class="tb-right">
        <span id="tb-user" class="tb-user"></span>
        <div class="tb-logo">PORTFOLIO MAG</div>
        <button id="tb-admin" class="btn btn-editor btn-sm" style="display:none">⚙ Admin</button>
        <button id="btn-logout" class="btn btn-ghost btn-sm">Sair</button>
      </div>
    </header>
    <main id="main-content"></main>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Módulos (ordem obrigatória) -->
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/views/secretaria.js"></script>
  <script src="js/views/tema.js"></script>
  <script src="js/views/revista.js"></script>
  <script src="js/views/editor.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/app.js"></script>

  <!-- Conteúdo da tela de login (branding do sistema), editável no painel central -->
  <script>
  (function(){
    var SLUG = 'revista';
    var DEFAULT = { marca:'Portfólio MAG', sub:'Revista digital · SME',
      titulo:'A produção da rede em revista.',
      tagline:'Portfólio e revista digital com as produções e registros da rede.',
      cta:'Entrar', cor:'#be123c', imagem_url:null, features:[
        {icon:'bi-book-half',titulo:'Revista',desc:'Edições da rede.'},
        {icon:'bi-images',titulo:'Portfólio',desc:'Registros das unidades.'},
        {icon:'bi-share',titulo:'Compartilhe',desc:'Publicações acessíveis.'}] };
    function $(id){ return document.getElementById(id); }
    function aplicar(d){
      var L = Object.assign({}, DEFAULT);
      if (d) ['marca','sub','titulo','tagline','cta','cor','imagem_url'].forEach(function(k){
        if (d[k] !== undefined && d[k] !== null && d[k] !== '') L[k] = d[k];
      });
      if (d && Array.isArray(d.features) && d.features.length) L.features = d.features;
      document.documentElement.style.setProperty('--rev-cor', L.cor || '#be123c');
      if ($('rv-marca')) $('rv-marca').textContent = L.marca || '';
      if ($('rv-sub')) $('rv-sub').textContent = L.sub || '';
      if ($('rv-titulo')) $('rv-titulo').textContent = L.titulo || '';
      if ($('rv-tagline')) $('rv-tagline').textContent = L.tagline || '';
      if ($('rv-cta')) $('rv-cta').textContent = L.cta || 'Entrar';
      var av = $('rv-avatar');
      if (av){
        if (L.imagem_url) av.innerHTML = '<img src="' + String(L.imagem_url).replace(/"/g,'') + '" alt="">';
        else av.textContent = (L.marca || 'MAG').replace(/[^A-Za-zÀ-ÿ0-9]/g,' ').trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase() || 'MAG';
      }
      var ul = $('rv-features'); if (ul){ ul.innerHTML = '';
        (L.features || []).slice(0,5).forEach(function(f){
          var li=document.createElement('li');
          var sp=document.createElement('span'); sp.className='fi'; sp.innerHTML='<i class="bi ' + String(f.icon||'bi-dot').replace(/"/g,'') + '"></i>';
          var dv=document.createElement('div');
          var b=document.createElement('b'); b.textContent=f.titulo||'';
          var s=document.createElement('span'); s.textContent=f.desc||'';
          dv.appendChild(b); dv.appendChild(s); li.appendChild(sp); li.appendChild(dv); ul.appendChild(li);
        });
      }
    }
    aplicar(null);
    // Enriquece com o conteúdo editável no painel central (leitura anônima).
    try {
      if (window.supabase){
        var CENTRAL = window.supabase.createClient(
          'https://pvdhepvtoavkyoschkod.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2ZGhlcHZ0b2F2a3lvc2Noa29kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTUzNDQsImV4cCI6MjA5Nzk5MTM0NH0.BY6jPR9iDvh2xRlGtaU8vdKWp0NKyC7Amlzx-tytmrk',
          { auth:{ persistSession:false, autoRefreshToken:false } }
        );
        CENTRAL.from('sistema_landing').select('marca,sub,titulo,tagline,cta,cor,imagem_url,features')
          .eq('slug', SLUG).maybeSingle()
          .then(function(r){ if (r && !r.error && r.data) aplicar(r.data); })
          .catch(function(){});
      }
    } catch(e){}
  })();
  </script>
</body>
</html>
